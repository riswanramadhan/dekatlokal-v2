project_id = "dekatlokal-digital-checkup"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[studio]
enabled = true
port = 54323
[auth]
enabled = true
site_url = "https://digitalcheckup.dekatlokal.com"
additional_redirect_urls = ["https://digitalcheckup.dekatlokal.com/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email.template.invite]
subject = "Undangan penilaian ahli Digital Checkup"
content_path = "./supabase/templates/invite.html"

[auth.email.template.magic_link]
subject = "Kode masuk Digital Checkup"
content_path = "./supabase/templates/otp.html"
[auth.email.template.confirmation]
subject = "Kode verifikasi Digital Checkup"
content_path = "./supabase/templates/otp.html"
[auth.email]
enable_signup = true
enable_confirmations = true
