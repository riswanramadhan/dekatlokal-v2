project_id = "dekatlokal-digital-checkup"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[studio]
enabled = true
port = 54323
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = false

[auth.email.template.invite]
subject = "Undangan penilaian ahli Digital Checkup"
content_path = "./supabase/templates/invite.html"

[auth.email.template.magic_link]
subject = "Tautan masuk Digital Checkup"
content_path = "./supabase/templates/magic-link.html"
[auth.email]
enable_signup = false
enable_confirmations = true
